name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build and verify Windows x64
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Check tag and select hosted extraction tool
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$version") {
            throw "Tag must match package.json: v$version"
          }
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          "AIO_SEVENZIP_BOOTSTRAP=$sevenZip" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Verify Electron runtime was installed
        run: node -e "require('node:fs').accessSync(require('electron')); console.log('Electron runtime is ready for packaging')"
      - run: npm audit --audit-level=high
      - name: Acquire hash-checked engines and download tools
        run: npm run engines
      - run: npm test
      - name: Verify every advertised conversion pair
        run: npm run test:matrix
      - name: Build full offline installer
        run: npm run dist
      - name: Verify packaged conversion engines
        run: |
          $env:AIO_ENGINE_ROOT = Join-Path $PWD 'release/win-unpacked/resources/engines'
          npm run test:engines
      - name: Verify packaged desktop
        run: |
          $env:AIO_PACKAGED_EXE = Join-Path $PWD 'release/win-unpacked/AIO Converter.exe'
          node scripts/verify-desktop.mjs
      - name: Record packaged binary inventory
        run: |
          $env:AIO_ENGINE_ROOT = Join-Path $PWD 'release/win-unpacked/resources/engines'
          node scripts/build-records.mjs
      - name: Assemble source and candidate files
        run: |
          node scripts/source-archive.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          New-Item -ItemType Directory release/upload -Force | Out-Null
          Copy-Item release/AIO-Converter-Setup-*.exe,release/AIO-Converter-Setup-*.exe.sha256,release/AIO-Converter-Source-*.zip,release/AIO-Converter-Source-*.zip.sha256,release/engine-build-records.json release/upload
          Copy-Item README.md,LICENSE,THIRD-PARTY-NOTICES.md,SUPPORTED-FORMATS.md,RELEASE-CHECKLIST.md,engines.lock.json release/upload
          Copy-Item output/matrix/results.json release/upload/conversion-test-results.json
          Copy-Item output/playwright/packaged-checks.json release/upload/desktop-test-results.json
          Copy-Item output/smoke-results.json release/upload/engine-smoke-test-results.json
          @"
          # CI candidate
          Commit: $env:GITHUB_SHA
          Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          Unsigned Windows x64 candidate. Build, core tests, conversion matrix,
          packaged engine smoke tests and local-converter desktop checks ran here.
          Website downloads were not exercised in CI. See README for manual tests.
          Installation/uninstallation and clean-machine offline validation remain manual.
          Exact corresponding engine/dependency sources and redistribution clearance
          remain required before publishing. The app source ZIP is not engine source.
          "@ | Set-Content release/upload/CI-CANDIDATE.md
      - name: Upload Windows candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AIO-Converter-Windows-x64
          path: release/upload/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-diagnostics
          path: |
            output/**/*.json
            output/playwright/*.png
            .cache/libreoffice-extract.log
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    name: Publish Windows installer release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AIO-Converter-Windows-x64
          path: candidate
      - name: Upload verified assets and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            import { createHash } from "node:crypto";
            const version = process.env.RELEASE_TAG.slice(1);
            const installer = `AIO-Converter-Setup-${version}.exe`;
            const files = readdirSync("candidate");
            if (!files.includes(installer)) throw Error("Expected Windows installer missing");
            for (const name of [installer, `AIO-Converter-Source-${version}.zip`]) {
              const expected = readFileSync(`candidate/${name}.sha256`, "utf8").trim().split(/\s+/)[0];
              const actual = createHash("sha256").update(readFileSync(`candidate/${name}`)).digest("hex");
              if (actual !== expected) throw Error(`Checksum mismatch: ${name}`);
            }
          '
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if node -e 'process.exit(JSON.parse(require("fs").readFileSync("release-state.json")).isDraft ? 1 : 0)'; then
              echo "Release is already published; keeping its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AIO Converter $RELEASE_TAG (unsigned candidate)" --notes-file candidate/CI-CANDIDATE.md
          fi
          gh release upload "$RELEASE_TAG" candidate/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
